[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "netacuity"
version = "7.0.0"
description = "Python client API for the NetAcuity Server"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Digital Envoy"},
]

[project.urls]
Homepage = "https://github.com/netacuity/netacuity-client-api-python"
"Bug Reports" = "https://github.com/netacuity/netacuity-client-api-python/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["netacuity*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
netacuity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]